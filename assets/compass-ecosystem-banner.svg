<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Explore the Compass ecosystem</title>
  <desc id="desc">Links to the Compass website, documentation, and Academy</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b2f"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <circle cx="1040" cy="40" r="145" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="130" cy="245" r="170" fill="#c084fc" opacity="0.14" filter="url(#glow)"/>
  <g aria-label="Compass logo">
    <image x="43" y="43" width="100" height="89" href="data:image/png;base64,"/>
  </g>
  <text x="155" y="82" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Build more with Compass</text>
  <text x="155" y="116" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">One platform. Practical guidance. Skills that compound.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="64" y="157" width="318" height="58" rx="12" fill="#ffffff" opacity="0.10" stroke="#c084fc"/>
    <text x="91" y="192" fill="#ffffff">COMPASS WEBSITE</text>
    <path d="M344 179l9 8-9 8M330 187h22" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    <rect x="441" y="157" width="318" height="58" rx="12" fill="#ffffff" opacity="0.10" stroke="#818cf8"/>
    <text x="468" y="192" fill="#ffffff">DOCUMENTATION</text>
    <path d="M721 179l9 8-9 8M707 187h22" fill="none" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="818" y="157" width="318" height="58" rx="12" fill="#ffffff" opacity="0.10" stroke="#38bdf8"/>
    <text x="845" y="192" fill="#ffffff">COMPASS ACADEMY</text>
    <path d="M1098 179l9 8-9 8M1084 187h22" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  </g>
</svg>
